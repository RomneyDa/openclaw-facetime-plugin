<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenClaw FaceTime Avatar</title>
    <style>
      html, body, #avatar { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111827; }
      body { font: 14px system-ui, sans-serif; color: white; }
      #preset { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #334155, #0f172a 68%); }
      .head { position: relative; width: min(52vw, 52vh); aspect-ratio: .78; border-radius: 48% 48% 44% 44%; background: linear-gradient(145deg, #e8b998, #b97958); box-shadow: 0 4vh 10vh #0008; }
      .eye { position: absolute; top: 38%; width: 11%; aspect-ratio: 1; border-radius: 50%; background: #111827; }
      .eye.left { left: 25%; } .eye.right { right: 25%; }
      #mouth { position: absolute; left: 50%; top: 68%; width: 30%; height: 3%; transform: translate(-50%, -50%); border-radius: 50%; background: #4a1720; box-shadow: inset 0 0 0 0.5vh #8f3e4d; transition: width 45ms linear, height 45ms linear; }
      #status { position: fixed; left: 1rem; bottom: 1rem; padding: .45rem .7rem; border-radius: .5rem; background: #0009; letter-spacing: .02em; }
      #resume { position: fixed; inset: 0; border: 0; background: #000b; color: white; font: 600 1.2rem system-ui; display: none; }
    </style>
  </head>
  <body>
    <div id="avatar"></div>
    <div id="preset"><div class="head"><div class="eye left"></div><div class="eye right"></div><div id="mouth"></div></div></div>
    <div id="status">connecting</div>
    <button id="resume" type="button">Click to enable avatar audio processing</button>
    <script type="module" src="/avatar.js"></script>
  </body>
</html>
